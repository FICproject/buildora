services:
  # Backend API on Render Web Service
  - type: web
    name: buildora-backend-api
    env: node
    plan: free
    buildCommand: pnpm install && pnpm --filter @buildora/backend-api build
    startCommand: node services/backend/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: buildora60
      - key: DEFAULT_TENANT_ID
        value: tenant-buildora-blr
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://buildora-jtns.vercel.app,https://buildora-vendor.vercel.app,https://buildora-customer.vercel.app
      - key: SENDGRID_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: ALLOW_DEV_OTP_FALLBACK
        value: "true"
      - key: CUSTOMER_OTP_MODE
        value: development

  # Customer Web on Render Static Site
  - type: web
    name: buildora-customer-web
    env: static
    plan: free
    buildCommand: pnpm install && pnpm --filter @buildora/customer-web build
    staticPublishPath: ./apps/customer-web/dist
    envVars:
      - key: VITE_API_URL
        value: https://buildora-vl8k.onrender.com/api/v1
      - key: VITE_DEFAULT_TENANT_ID
        value: tenant-buildora-blr
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Vendor Portal on Render Static Site
  - type: web
    name: buildora-vendor-web
    env: static
    plan: free
    buildCommand: pnpm install && pnpm --filter @buildora/vendor-web build
    staticPublishPath: ./apps/vendor-web/dist
    envVars:
      - key: VITE_API_URL
        value: https://buildora-vl8k.onrender.com/api/v1
      - key: VITE_DEFAULT_TENANT_ID
        value: tenant-buildora-blr
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
